name: Sync secrets to server

# MANUAL ONLY, AND THAT IS DELIBERATE.
#
# This workflow writes the protected secrets file on the deployment host. It is `workflow_dispatch`
# only — it never runs on push — because rewriting live broker credentials is an operator decision with
# a blast radius, not something a merge should trigger. Nothing here builds, tests or deploys code:
# `start.sh` on the server owns deployment. This workflow's ONLY job is to move credential material
# from GitHub's encrypted secret store into /etc/gts/secrets.env.
#
# WHAT IT MUST NEVER DO, AND HOW EACH IS PREVENTED
#
#   · Overwrite the server's operational .env.  It writes exactly ONE path — the secrets file — and
#     never touches .env. The BOX risk configuration an operator tuned is not GitHub's business, and a
#     deployment that recreated .env from a template would silently reset live risk limits.
#   · Echo a secret into the logs.  Secrets are never interpolated into a `run:` script (which would
#     place them in the command line, visible in the log and in `ps` on the runner). They are passed as
#     step `env:` and forwarded over ssh **stdin**. No `echo`, no `printenv`, no `set -x`.
#   · Leave a secret on disk in a temporary file.  The payload is streamed to `install` via stdin on the
#     server; no intermediate file is created on the runner or on the host.
#   · Leave the file world-readable.  `install -m 600` sets the mode ATOMICALLY as the file is created,
#     so there is no window in which it exists with default permissions.
#
# `set -x` / `bash -x` MUST NOT be added to any step below. Shell tracing prints expanded variables,
# which is precisely a secret dump.
#
# See docs/SECRETS_AND_CONFIG.md for the GitHub Secrets to create and the one-time server setup.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "sync" to confirm you intend to rewrite the server secrets file'
        required: true
        default: ""
      restart:
        description: "Restart the backend afterwards so the new credentials take effect"
        type: boolean
        required: false
        default: false

# This workflow reads nothing from the repo but its own checkout.
permissions:
  contents: read

# Never two credential writes at once: an interleaved write could produce a file containing half of
# each rotation.
concurrency:
  group: sync-secrets
  cancel-in-progress: false

jobs:
  sync:
    name: Write /etc/gts/secrets.env over SSH
    runs-on: ubuntu-latest
    # A GitHub Environment lets you require a manual approval before this runs. Strongly recommended
    # for production credentials; create it in repo Settings -> Environments.
    environment: production
    steps:
      - name: Confirm intent
        if: ${{ inputs.confirm != 'sync' }}
        run: |
          echo "Refusing: the confirm input must be exactly 'sync'."
          echo "This workflow rewrites live broker credentials on the deployment host."
          exit 1

      # The SSH key is itself a secret and gets the same treatment: written by `install -m 600` from
      # stdin, never echoed, and removed at the end of the job even if a later step fails.
      - name: Install the deploy SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [ -z "${SSH_PRIVATE_KEY:-}" ] || [ -z "${SSH_KNOWN_HOSTS:-}" ]; then
            echo "Missing DEPLOY_SSH_KEY or DEPLOY_KNOWN_HOSTS repository secret."
            exit 1
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | install -m 600 /dev/stdin ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" | install -m 644 /dev/stdin ~/.ssh/known_hosts

      # THE ONE STEP THAT MOVES CREDENTIALS.
      #
      # Every secret is bound to a step-level env var, then written by a tiny generator that reads
      # `process.env` directly. Nothing is interpolated into the shell command, so no value can appear
      # in the workflow log, in the runner's process table, or in a shell history.
      #
      # StrictHostKeyChecking=yes with an explicit known_hosts: without it, a first connection to a
      # spoofed host would be trusted and every credential below would be handed to it.
      - name: Write the secrets file
        env:
          # Site / session
          SITE_ACCESS_SECRET: ${{ secrets.SITE_ACCESS_SECRET }}
          # At-rest token encryption
          BROKER_TOKEN_ENCRYPTION_KEY: ${{ secrets.BROKER_TOKEN_ENCRYPTION_KEY }}
          # Datastores (DSNs carry passwords)
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          # Zerodha / Kite
          KITE_API_KEY: ${{ secrets.KITE_API_KEY }}
          KITE_API_SECRET: ${{ secrets.KITE_API_SECRET }}
          KITE_TOKEN_BROKER_PASSCODE: ${{ secrets.KITE_TOKEN_BROKER_PASSCODE }}
          # Dhan
          DHAN_API_KEY: ${{ secrets.DHAN_API_KEY }}
          DHAN_API_SECRET: ${{ secrets.DHAN_API_SECRET }}
          DHAN_TOKEN_BROKER_PASSCODE: ${{ secrets.DHAN_TOKEN_BROKER_PASSCODE }}
          # Optional token-exposure surface
          TOKEN_EXPOSURE_KEY: ${{ secrets.TOKEN_EXPOSURE_KEY }}
          # Host
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          SECRETS_PATH: ${{ vars.GTS_SECRETS_FILE || '/etc/gts/secrets.env' }}
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_HOST:-}" ] || [ -z "${DEPLOY_USER:-}" ]; then
            echo "Missing DEPLOY_HOST or DEPLOY_USER repository secret."
            exit 1
          fi

          # Emit `KEY=value` lines for the secrets that are actually configured, skipping the empty
          # ones so an unset optional secret does not become an empty assignment that the loader would
          # treat as present-but-blank. Reads process.env; interpolates nothing into the shell.
          # Prints ONLY to the pipe, and reports counts to stderr — never a name/value pair.
          node --input-type=module -e '
            const names = [
              "SITE_ACCESS_SECRET","BROKER_TOKEN_ENCRYPTION_KEY","DATABASE_URL","MONGODB_URI",
              "KITE_API_KEY","KITE_API_SECRET","KITE_TOKEN_BROKER_PASSCODE",
              "DHAN_API_KEY","DHAN_API_SECRET","DHAN_TOKEN_BROKER_PASSCODE","TOKEN_EXPOSURE_KEY",
            ];
            const out = ["# Managed by .github/workflows/sync-secrets.yml. Do not edit by hand.",
                         "# Credentials ONLY. Operational BOX configuration belongs in the repo .env.",
                         `# Written ${new Date().toISOString()}`];
            let set = 0, skipped = 0;
            for (const n of names) {
              const v = process.env[n];
              if (v === undefined || v.trim() === "") { skipped++; continue; }
              if (/[\r\n]/.test(v)) { console.error(`refusing ${n}: contains a newline`); process.exit(1); }
              out.push(`${n}=${v}`);
              set++;
            }
            if (set === 0) { console.error("refusing: not one secret was configured"); process.exit(1); }
            console.error(`prepared ${set} secret(s); ${skipped} unset and skipped`);
            process.stdout.write(out.join("\n") + "\n");
          ' | ssh -i ~/.ssh/deploy_key \
                  -o StrictHostKeyChecking=yes \
                  -o UserKnownHostsFile=~/.ssh/known_hosts \
                  "${DEPLOY_USER}@${DEPLOY_HOST}" \
                  "umask 077 && sudo install -D -m 600 -o \$(id -un) -g \$(id -gn) /dev/stdin '${SECRETS_PATH}' && sudo chmod 600 '${SECRETS_PATH}' && echo 'secrets file written'"

      # Restarting is opt-in. The backend re-reads the secrets file on every start, so until it is
      # restarted the OLD credentials remain in force — which is the correct default for a rotation you
      # want to verify before it takes effect.
      - name: Restart the backend
        if: ${{ inputs.restart }}
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          PM2_APP: ${{ vars.PM2_APP || 'gts-backend' }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile=~/.ssh/known_hosts \
              "${DEPLOY_USER}@${DEPLOY_HOST}" \
              "pm2 restart '${PM2_APP}' --update-env && pm2 save --force"

      # Verification that reveals nothing: the backend's own startup diagnostic reports each credential
      # as `configured` or `missing`, never a value. Grepping for `missing` is a real check.
      - name: Verify without revealing
        if: ${{ inputs.restart }}
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          PM2_APP: ${{ vars.PM2_APP || 'gts-backend' }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile=~/.ssh/known_hosts \
              "${DEPLOY_USER}@${DEPLOY_HOST}" \
              "sleep 8; pm2 logs '${PM2_APP}' --lines 200 --nostream 2>/dev/null | grep -a '\[Config\]' || true"

      - name: Remove the SSH key from the runner
        if: always()
        run: rm -f ~/.ssh/deploy_key
