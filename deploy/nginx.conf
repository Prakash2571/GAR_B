# nginx reverse proxy for the GTS Algo Research backend.
#
# The backend serves a normal JSON API AND a long-lived Server-Sent Events stream
# (GET /api/box/stream). SSE breaks under any proxy that buffers the response,
# caches it, or times out an idle-but-open connection — so the /api/box/stream
# location below turns all of that off. See the inline notes.
#
# Replace gts.example.com and the TLS paths with your own. The upstream port must
# match PORT in .env (default 3001).
#
# ─────────────────────────────────────────────────────────────────────────────────
# SPA ROUTING — READ THIS IF YOU SERVE THE FRONTEND FROM THIS HOST
# ─────────────────────────────────────────────────────────────────────────────────
# The frontend is a single-page app with REAL URLs, not hash routes:
#
#     /       the public GTS Algo Research page
#     /box    the protected GTS Box workspace
#
# The browser can therefore request `/box` DIRECTLY — on a bookmark, a refresh, or
# a shared link. There is no `/box` file on disk and no `/box` route on the
# backend, so without an SPA fallback that request 404s and the workspace is
# unreachable except by clicking through from the home page.
#
# The fix is one line in whichever server block serves the built frontend:
#
#     try_files $uri $uri/ /index.html;
#
# Two supported topologies:
#
#   (A) SEPARATE ORIGINS — this file as-is.
#       This server block is API-ONLY: `location /` proxies everything to the
#       backend. The frontend is served by its own server block (see the commented
#       example at the bottom of this file) and reaches the API cross-origin.
#       If you use this, FRONTEND_URL / CSRF_ALLOWED_ORIGIN must name the frontend
#       origin, and the session cookie is SameSite=Strict — so confirm the browser
#       actually sends it before going live.
#
#   (B) ONE ORIGIN (recommended, and what the frontend defaults to).
#       The SPA and the API share an origin: the SPA is served from disk and only
#       `/api` is proxied. The frontend then makes RELATIVE `/api/...` requests
#       (leave VITE_API_BASE_URL unset), the HttpOnly session cookie is
#       same-origin, and CSRF origin checks are trivially satisfied. To use this
#       topology, replace the `location /` block below with the `root` +
#       `try_files` block shown in the commented example.
#
# In BOTH topologies the backend port is never exposed directly — nginx terminates
# TLS and is the only public listener.
# ─────────────────────────────────────────────────────────────────────────────────

upstream gts_backend {
    server 127.0.0.1:3001;
    keepalive 16;
}

server {
    listen 443 ssl;
    server_name gts.example.com;

    ssl_certificate     /etc/letsencrypt/live/gts.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gts.example.com/privkey.pem;

    # The session cookie is HttpOnly + Secure; HTTPS is required.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # ---- Normal API + everything else ----
    #
    # TOPOLOGY (A): this host is API-only, so everything proxies to the backend.
    # For TOPOLOGY (B) replace this whole block with:
    #
    #     root /var/www/gts;                      # the frontend's built dist/
    #     index index.html;
    #     location / { try_files $uri $uri/ /index.html; }
    #     location /api { proxy_pass http://gts_backend; ...the headers below... }
    #
    location / {
        proxy_pass http://gts_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Same-origin cookie session + CSRF origin checks depend on these being
        # forwarded correctly.
    }

    # ---- Readiness / health probe: GET /api/health ----
    #
    # HONEST READINESS. The backend uses listen-with-503: it binds the socket at
    # process start (so this endpoint is always REACHABLE — a connection refused
    # would look identical to "process crashed") but answers:
    #     HTTP 200  {"state":"ready","ready":true,...}   only once boot completed
    #     HTTP 503  {"ready":false,...}                  while starting / failed /
    #                                                     shutting_down
    # The body is contentless beyond liveness/readiness (no broker/token/position/
    # exposure/migration detail), so it is safe to expose to a health checker.
    #
    # If you run an nginx upstream health check (nginx-plus `health_check`) or an
    # external load balancer, treat 200 as "in service" and 503 as "out of service"
    # so traffic is only routed once the process is genuinely ready and is drained
    # the moment it starts shutting down. This plain-nginx location just proxies it;
    # it does not itself gate on the status code.
    location = /api/health {
        proxy_pass http://gts_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Never cache the readiness answer — a cached 200 during a restart would
        # hide the 503 the backend is deliberately returning while it boots.
        proxy_cache off;
        add_header Cache-Control "no-store" always;
    }

    # ---- Token exposure: GET /api/tokens/{zerodha|dhan} ----
    #
    # THESE TWO ROUTES RETURN A PLAINTEXT BROKER ACCESS TOKEN. They exist so sibling
    # services can borrow the token this deployment minted instead of each running
    # their own broker login (see docs/BROKER_TOKENS.md). The backend already requires
    # a 32+ character shared secret in the `x-token-access-key` header, compares it in
    # constant time, rate limits to 30 req/min/IP and answers 503 unless
    # TOKEN_EXPOSURE_KEY is set.
    #
    # DEFENCE IN DEPTH IS STILL YOUR JOB HERE. The application cannot know which hosts
    # are legitimate; nginx can. UNCOMMENT AND EDIT the block below so only the servers
    # that genuinely need a token can reach the route at all — then a leaked key is not
    # sufficient on its own.
    #
    # It is left commented out rather than shipped with invented addresses because a
    # wrong allow-list here fails CLOSED and would silently break a working deployment.
    #
    # location ^~ /api/tokens/ {
    #     # Only these may even open the route. Everything else never reaches Node.
    #     allow 10.0.0.0/8;        # <- replace with your real service subnet(s)
    #     allow 127.0.0.1;
    #     deny  all;
    #
    #     proxy_pass http://gts_backend;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host              $host;
    #     proxy_set_header X-Real-IP         $remote_addr;
    #     proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #
    #     # A cached response here would hand the token to the NEXT caller without a
    #     # credential check. The backend sets no-store; do not undo it.
    #     proxy_cache off;
    #     add_header Cache-Control "no-store" always;
    #
    #     # Do not write the credential header into the access log.
    #     access_log /var/log/nginx/gts-tokens.log combined;
    # }

    # ---- Broker OAuth callbacks: GET /api/broker/{zerodha|dhan}/callback ----
    #
    # Handled by `location /` above; no special block is needed. Two things matter:
    #   1. The redirect URL registered on each broker app must be the PUBLIC https URL
    #      of this server plus /api/broker/{broker}/callback. Both brokers ignore any
    #      redirect target the backend sends and always use their registered copy.
    #   2. X-Forwarded-Proto must be set (it is, above) so the backend builds its
    #      post-login redirect back to the frontend correctly.

    # ---- Server-Sent Events: GET /api/box/stream ----
    location = /api/box/stream {
        proxy_pass http://gts_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WHY EACH OF THESE IS REQUIRED FOR SSE:

        # proxy_buffering off:
        #   With buffering ON, nginx accumulates the upstream response and only
        #   flushes it in chunks. For SSE that means events are held back and the
        #   client sees them late or in bursts — the live board appears frozen.
        #   OFF makes every `data:` frame reach the browser the instant the
        #   backend writes it.
        proxy_buffering off;

        # proxy_cache off:
        #   An event stream must never be cached or coalesced. Caching a
        #   never-ending 200 response would serve a stale prefix to the next
        #   client and can wedge the connection entirely.
        proxy_cache off;

        # proxy_read_timeout (long):
        #   SSE connections are intentionally long-lived and can be quiet between
        #   events (an idle but healthy stream sends only periodic keep-alives).
        #   The default 60s would drop a perfectly good stream during a lull. A
        #   long timeout keeps it open; the backend's own keep-alive comments
        #   keep intermediaries from idling it out.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # X-Accel-Buffering no:
        #   Belt-and-braces alongside `proxy_buffering off` — this header tells
        #   nginx (and any nginx-aware upstream layer) not to buffer THIS
        #   response specifically, even if buffering is on elsewhere. Setting it
        #   here guarantees the stream is unbuffered regardless of other config.
        proxy_set_header X-Accel-Buffering no;

        # SSE does not upgrade the protocol, but keep the connection header clean.
        proxy_set_header Connection "";
    }
}

