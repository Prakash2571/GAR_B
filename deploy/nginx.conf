# EXAMPLE: the frontend origin, with the SPA fallback that makes /box work.
#
# This is TOPOLOGY (B) in one block — the recommended arrangement. Serve the
# frontend's built `dist/` from disk, proxy only `/api` to the backend, and fall
# back to index.html for every non-file path so a direct hit on `/box` (bookmark,
# refresh, shared link) loads the app instead of 404ing.
#
# The SPA itself decides what to show: `/box` mounts the workspace only behind the
# session guard, and an unauthenticated visitor is redirected to `/?auth=1`. nginx
# must NOT try to protect `/box` — authorisation is the backend's job, enforced
# per-request on every `/api/box/*` call.
# ─────────────────────────────────────────────────────────────────────────────────
#
